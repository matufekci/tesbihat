name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Debug APK derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Otomatik regresyon testleri
        run: npm test

      - name: Kod kontrolü
        run: npm run lint

      - name: Web derle
        run: npm run build

      - name: Capacitor senkronu
        run: npx cap sync android

      - name: APK derle (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: tesbihat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
